name: Deploy to PRD

# prd runs on the homeserver only (hetzner-latarnia-1 was decommissioned,
# T-0018). Adding a prd host again = bootstrap it per docs/local/deployment.md,
# register a runner with its own label, and fan out via a `fail-fast: false`
# matrix keyed on those labels (see T-0005 for the previous version).

on:
  push:
    branches: [main]
  # Escape hatch: re-deploy the current `main` (e.g. after a failed run)
  # without needing an empty commit.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to homeserver (prd)
    # Pinned to the homeserver label, never bare `self-hosted` (runner-labels-not-arch).
    runs-on: [self-hosted, homeserver]
    environment: production

    steps:
      - name: Capture pre-deploy state
        run: |
          PORT=$(python3 -c "import json; print(json.load(open('/opt/latarnia/prd/config/config.json'))['system']['main_port'])")
          echo "PORT=$PORT" >> $GITHUB_ENV
          PRE_HEALTH=$(curl -sf --max-time 5 http://localhost:$PORT/health | python3 -c "import sys,json; print(json.load(sys.stdin)['health'])" 2>/dev/null || echo "unavailable")
          PRE_COUNT=$(curl -sf --max-time 5 http://localhost:$PORT/api/apps | python3 -c "import sys,json; print(json.load(sys.stdin)['total_count'])" 2>/dev/null || echo "-1")
          echo "PRE_HEALTH=$PRE_HEALTH" >> $GITHUB_ENV
          echo "PRE_COUNT=$PRE_COUNT" >> $GITHUB_ENV
          echo "Pre-deploy on homeserver: health=$PRE_HEALTH, apps=$PRE_COUNT"

      - name: Backup deploy folder
        run: |
          BACKUP_DIR="/opt/latarnia/backups/prd"
          mkdir -p "$BACKUP_DIR"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          # The point of this snapshot is to recover host-local *gitignored* files that
          # `git reset --hard origin/main` cannot restore (config/config.json, secrets/,
          # caddy/). `data/` and `apps/` are also gitignored, but reset never touches them
          # either, so copying them buys no rollback safety — and they hold app runtime
          # data (750+ scraped PDFs on tst). `.venv` is likewise derived — rebuilt from
          # requirements.txt. Together they were ~1.5 GB duplicated on every deploy.
          # Anchored with a leading `/` so only the env root's own data/, apps/ and
          # .venv/ are skipped, not a nested directory that shares the name.
          rsync -a --exclude='.git' --exclude='/data/' --exclude='/apps/' \
            --exclude='/.venv/' \
            /opt/latarnia/prd/ "$BACKUP_DIR/$TIMESTAMP/"
          # Keep the 2 most recent snapshots (the one just taken, plus the previous
          # deploy's). `tail -n +3` drops everything from the 3rd-newest on.
          ls -1t "$BACKUP_DIR" | tail -n +3 | xargs -r -I {} rm -rf "$BACKUP_DIR/{}"

      - name: Pull latest code
        run: |
          cd /opt/latarnia/prd
          git fetch
          git reset --hard origin/main

      - name: Restart PRD service
        run: sudo systemctl restart latarnia-prd.service

      - name: Verify post-deploy health
        run: |
          echo "Pre-deploy state: health=$PRE_HEALTH, apps=$PRE_COUNT"
          for i in $(seq 1 12); do
            POST_HEALTH=$(curl -sf --max-time 5 http://localhost:$PORT/health | python3 -c "import sys,json; print(json.load(sys.stdin)['health'])" 2>/dev/null || echo "")
            POST_COUNT=$(curl -sf --max-time 5 http://localhost:$PORT/api/apps | python3 -c "import sys,json; print(json.load(sys.stdin)['total_count'])" 2>/dev/null || echo "")
            if [ -n "$POST_HEALTH" ] && [ -n "$POST_COUNT" ]; then
              break
            fi
            echo "Waiting for service... ($i/12)"
            sleep 5
          done
          echo "Post-deploy: health=$POST_HEALTH, apps=$POST_COUNT"
          if [ -z "$POST_HEALTH" ]; then
            echo "ERROR: Service did not respond after 60s"
            exit 1
          fi
          if [ "$POST_HEALTH" = "error" ]; then
            echo "ERROR: Platform health is 'error' after deploy"
            exit 1
          fi
          if [ "$PRE_COUNT" != "-1" ] && [ "$POST_COUNT" -lt "$PRE_COUNT" ]; then
            echo "ERROR: App count dropped from $PRE_COUNT to $POST_COUNT"
            exit 1
          fi
          echo "Deploy verified: health=$POST_HEALTH, apps=$POST_COUNT"

      - name: Report deployed commit
        # always(): a failed health gate still leaves the host on the new commit
        # (the reset already ran), which is precisely when it must be visible.
        if: always()
        run: |
          cd /opt/latarnia/prd
          echo "homeserver is now on $(git rev-parse HEAD)"
          echo "### homeserver: \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
